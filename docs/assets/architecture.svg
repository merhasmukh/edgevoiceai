<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#2d1b4e" />
    </linearGradient>
    <linearGradient id="geminiBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#c084fc" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Title / Legend -->
  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">
    EdgeVoiceAI • Full-Duplex Architecture
  </text>

  <!-- ==================== CLIENT DEVICE CONTAINER ==================== -->
  <g transform="translate(30, 60)">
    <rect width="520" height="390" rx="12" fill="url(#clientGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Client Header -->
    <rect width="520" height="42" rx="12" fill="#1e293b" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#eab308" />
    <circle cx="56" cy="21" r="5" fill="#22c55e" />
    <text x="80" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
      Edge Device (Raspberry Pi / Linux / macOS / Windows)
    </text>

    <!-- 1. Mic Stream -->
    <g transform="translate(25, 65)">
      <rect width="210" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="15" y="26" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">🎙️ MicrophoneStream</text>
      <text x="15" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">16kHz Native Mono PCM</text>
    </g>

    <!-- Arrow Mic -> VAD -->
    <path d="M 130 125 L 130 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

    <!-- 2. VAD -->
    <g transform="translate(25, 155)">
      <rect width="210" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="15" y="26" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">⚡ VoiceActivityDetector</text>
      <text x="15" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">Energy Gating &amp; Onset</text>
    </g>

    <!-- Arrow VAD -> WS Client -->
    <path d="M 130 215 L 130 240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

    <!-- 3. WS Client Outbound -->
    <g transform="translate(25, 245)">
      <rect width="210" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="15" y="26" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">📤 WebSockets Client</text>
      <text x="15" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">realtimeInput (Audio frames)</text>
    </g>

    <!-- 4. WS Receiver Inbound -->
    <g transform="translate(285, 65)">
      <rect width="210" height="60" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <text x="15" y="26" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">📥 WebSockets Receiver</text>
      <text x="15" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">serverContent (Audio/Calls)</text>
    </g>

    <!-- Arrow WS Receiver -> Audio Player -->
    <path d="M 340 125 L 340 150" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" />
    <!-- Arrow WS Receiver -> Tool Registry -->
    <path d="M 440 125 L 440 150" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" />

    <!-- 5. Audio Player -->
    <g transform="translate(270, 155)">
      <rect width="115" height="150" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" />
      <text x="10" y="26" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="700">🔊 AudioPlayer</text>
      <text x="10" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10">24kHz PCM</text>
      <rect x="8" y="65" width="99" height="75" rx="6" fill="#1e293b" />
      <text x="14" y="85" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">⚡ Barge-In:</text>
      <text x="14" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="9">&lt;50ms Instant</text>
      <text x="14" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="9">Buffer Drop &amp;</text>
      <text x="14" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="9">Echo Shield</text>
    </g>

    <!-- 6. Tool Dispatcher -->
    <g transform="translate(395, 155)">
      <rect width="110" height="60" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5" />
      <text x="10" y="26" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="700">🔧 Tool Dispatcher</text>
      <text x="10" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">ToolRegistry</text>
    </g>

    <!-- Arrow Tool Dispatcher -> Memory -->
    <path d="M 450 215 L 450 240" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

    <!-- 7. Memory & Vector Store -->
    <g transform="translate(395, 245)">
      <rect width="110" height="60" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <text x="10" y="26" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">🧠 Memory &amp; RAG</text>
      <text x="10" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9">SQLite/Qdrant</text>
    </g>

    <!-- Barge-In feedback arrow from VAD to Player -->
    <path d="M 235 185 L 265 185" stroke="#ef4444" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />
    <text x="250" y="177" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="700">Cutoff</text>
  </g>

  <!-- ==================== CLOUD CONTAINER ==================== -->
  <g transform="translate(680, 100)">
    <rect width="250" height="310" rx="16" fill="url(#cloudGrad)" stroke="url(#geminiBorder)" stroke-width="2" />
    
    <!-- Cloud Icon + Header -->
    <text x="125" y="45" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">
      ☁️ Google Gemini Live
    </text>
    <text x="125" y="68" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11">
      gemini-2.0-flash-exp
    </text>

    <!-- Feature Pills inside Cloud -->
    <g transform="translate(20, 95)">
      <rect width="210" height="42" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="15" y="26" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="600">Bidirectional Live Audio</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="210" height="42" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="15" y="26" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="600">Realtime Turn Detection</text>
    </g>

    <g transform="translate(20, 205)">
      <rect width="210" height="42" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="15" y="26" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="600">Client Tool Invocation</text>
    </g>

    <text x="125" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">
      Sub-second conversational latency
    </text>
  </g>

  <!-- ==================== INTER-SYSTEM CONNECTORS ==================== -->
  <!-- Audio Uplink (Client -> Cloud) -->
  <path d="M 265 335 L 675 335" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" fill="none" />
  <rect x="360" y="322" width="220" height="24" rx="12" fill="#0b0f19" stroke="#38bdf8" stroke-width="1" />
  <text x="470" y="338" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">
    ▲ 16kHz PCM Audio Stream
  </text>

  <!-- Audio Downlink & Tool Calls (Cloud -> Client) -->
  <path d="M 675 155 L 525 155" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)" fill="none" />
  <rect x="540" y="142" width="120" height="24" rx="12" fill="#0b0f19" stroke="#c084fc" stroke-width="1" />
  <text x="600" y="158" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">
    ▼ 24kHz Audio &amp; Tools
  </text>
</svg>

