[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevoiceai"
version = "0.1.2"
description = "A modular, full-duplex conversational Voice AI framework for edge devices (Raspberry Pi) and laptops (macOS, Linux, Windows)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hasmukh Mer", email = "mhgn0001@gmail.com" }
]
keywords = [
    "voice-ai",
    "realtime",
    "full-duplex",
    "gemini-live",
    "raspberry-pi",
    "barge-in",
    "rag",
    "edge-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "websockets>=12.0",
    "pyaudio>=0.2.14",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.11.0",
]
pinecone = [
    "pinecone>=5.0.0",
]
media = [
    "pygame>=2.5.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0",
]
all = [
    "qdrant-client>=1.11.0",
    "pinecone>=5.0.0",
    "pygame>=2.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/merhasmukh/edgevoiceai"
Documentation = "https://merhasmukh.github.io/edgevoiceai"
Repository = "https://github.com/merhasmukh/edgevoiceai.git"
Issues = "https://github.com/merhasmukh/edgevoiceai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgevoiceai*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.html", "*.css", "*.js", "*.png", "*.jpg", "*.svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["edgevoiceai/tests"]
